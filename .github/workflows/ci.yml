name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: 04_Development/app

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: 04_Development/app/.nvmrc
          cache: npm
          cache-dependency-path: 04_Development/app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: 04_Development/app/reports/lighthouse.json
          if-no-files-found: ignore
